schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Tech stack: TypeScript (strict, ESM) on Node.js, in a pnpm + Turborepo
  monorepo. Rspack bundles the CLI into a single executable file; commander
  parses arguments; pino writes the log file; Biome lints and formats (including
  Markdown); vitest + testcontainers run the unit and e2e tests.
  Layout (hexagonal): packages/core (domain, use cases, ports; no Node APIs),
  packages/git, packages/tmux, packages/logging (adapters), apps/bonsai (thin
  CLI + composition root).
  Binary: `bs` (bonsai) — provisions clean git worktrees for fast
  context-switching. Requires Node.js at runtime.
  Workflow: every routine action is a mise task that calls `turbo run`
  (`mise run build|typecheck|test|lint|format|ci|install`); git hooks and CI call
  only mise tasks.
  We use conventional commits.

