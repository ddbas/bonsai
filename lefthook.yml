post-checkout:
  parallel: true
  jobs:
    - name: codegraph
      run: mise exec -- codegraph init
pre-commit:
  parallel: true
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: rust
            run: cargo fmt
            glob: "*.rs"
            stage_fixed: true
          - name: markdown
            run: mise exec -- prettier --write {staged_files}
            glob: "*.md"
            stage_fixed: true
    - name: lint
      glob: "*.rs"
      run: cargo clippy -- -D warnings
      stage_fixed: true
    - name: test
      run: mise run test
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        - "src/**/*.rs"
        - "tests/**/*.rs"
    - name: bench
      run: mise run bench
      glob:
        - "Cargo.toml"
        - "Cargo.lock"
        - "src/**/*.rs"
        - "benches/**/*.rs"
    - name: openspec-validate
      run: bash scripts/openspec-validate-staged.sh {staged_files}
      glob: "openspec/**"
