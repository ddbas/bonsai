post-checkout:
  parallel: true
  jobs:
    - name: codegraph
      run: mise exec -- codegraph init
pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,cjs,mjs,json,jsonc,md}"
      run: mise run format {staged_files}
      stage_fixed: true
    # turbo orders build -> typecheck/test/lint so each runs once
    - name: verify
      run: mise run ci
    - name: openspec-validate
      run: bash scripts/openspec-validate-staged.sh {staged_files}
      glob: "openspec/**"
