#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["node"]

[hooks]
enter = "lefthook install"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "12.16.1"

[tasks.deps]
description = "Install dependencies (frozen lockfile in CI)"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "apps/*/package.json", "packages/*/package.json"]
outputs = ["node_modules/.modules.yaml"]

[tasks.build]
description = "Build all packages"
depends = ["deps"]
run = "pnpm exec turbo run build"

[tasks.typecheck]
description = "Typecheck all packages"
depends = ["deps"]
run = "pnpm exec turbo run typecheck"

[tasks.test]
description = "Run all tests (builds first)"
depends = ["deps"]
run = "pnpm exec turbo run test"

[tasks.lint]
description = "Lint and format-check with Biome"
depends = ["deps"]
run = "pnpm exec turbo run //#lint"

[tasks.format]
description = "Format with Biome (applies fixes); optionally pass files"
depends = ["deps"]
run = "pnpm exec turbo run //#format:biome --"

[tasks.ci]
description = "Run build, typecheck, test and lint"
depends = ["deps"]
run = "pnpm exec turbo run ci"

[tasks.install]
description = "Build and install bs into ~/.local/bin (or $BONSAI_INSTALL_DIR)"
depends = ["deps"]
run = """
pnpm exec turbo run build --filter=bonsai
dir="${BONSAI_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$dir"
rm -f "$dir/bs"
install -m 755 "$PWD/apps/bonsai/dist/cli.cjs" "$dir/bs"
"""

[tasks."openspec:open"]
description = "Render an OpenSpec proposal to HTML and open it in the browser"
usage = '''
arg "<change-id>" help="OpenSpec change ID to preview (e.g. my-feature)"
complete "change-id" run="openspec list --json | jq -r '.changes[].name'"
'''
run = "scripts/view-proposal.sh ${usage_change_id?}"
