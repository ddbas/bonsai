#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "12.16.1"

[tasks.build]
description = "Build all packages"
run = "mise exec -- pnpm run build"

[tasks.deps]
description = "Install dependencies"
run = "pnpm install"

[tasks.test]
description = "Run all tests (builds first)"
depends = ["deps"]
run = "pnpm exec turbo run test"

[tasks.lint]
description = "Lint all packages"
run = "pnpm run lint"

[tasks."lint:fix"]
description = "Lint all packages"
run = "pnpm run lint:fix"

[tasks.ci]
description = "Run build, test and lint"
depends = ["deps"]
run = "mise exec -- pnpm run ci"

[tasks.install]
description = "Build and symlink bonsai into the local bin dir"
run = "pnpm run install:local"

