#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
pnpm = "12.16.1"

[tasks.build]
description = "Build all packages"
run = "mise exec -- pnpm run build"

[tasks.deps]
description = "Install all dependencies"
usage = 'flag "--frozen-lockfile" help="Fail if the lockfile needs updating"'
run = "mise exec -- pnpm install ${usage_frozen_lockfile:+--frozen-lockfile}"

[tasks.install]
description = "Build and symlink bonsai into the local bin dir"
run = "mise exec -- pnpm run install:local"

[tasks.lint]
description = "Lint all packages"
run = "mise exec -- pnpm run lint"

[tasks."lint:fix"]
description = "Lint all packages"
run = "mise exec -- pnpm run lint:fix"

[tasks."openspec:list"]
description = "List all OpenSpec proposals"
run = "mise exec -- pnpm run openspec:list"

[tasks."openspec:validate"]
description = "Validate all OpenSpec files"
run = "mise exec -- pnpm run openspec:validate"

[tasks.test]
description = "Run all tests"
run = "mise exec -- pnpm run test"

[tasks.verify]
description = "Run all verifications"
run = "mise exec -- pnpm run verify"

[tasks."verify:fix"]
description = "Run all verifications and fix any fixable issues"
run = "mise exec -- pnpm run verify:fix"
